name: Intraday Paper Trader

# Runs entirely on GitHub's servers, so it trades even when your PC is off.
# On the cadence configured in your external trigger (cron-job.org, every
# 15 min) during NSE market hours, on weekdays, it:
#   restore state -> fetch fresh price data -> signals -> paper orders -> save state
#
# The strategy squares off ALL positions at 15:15 IST, so nothing is ever held
# overnight; between-day state is just cash balance + trade history.

# ---------------------------------------------------------------------------
# WHY A SESSION CAN END WITH ZERO OPTION TRADES, AND NOT BE BROKEN
#
# On the trading day BEFORE A MONTHLY EXPIRY the options book takes no
# position at all. A green run with no option trades on that one day is
# expected. Do not go looking for a fault.
#
# WHAT HAPPENS. Every underlying's nearest listed contract is at DTE 1 that
# day. The entry floor `min_dte = 2` rejects it, and a DTE rejection DROPS
# the candidate rather than advancing it to the next listed expiry - so every
# candidate is dropped and nothing is entered.
#
# WHY IT HITS EVERYTHING AT ONCE. Single stocks and BANKNIFTY list MONTHLY
# contracts only; NIFTY also lists weeklies. On an ordinary Monday before a
# weekly expiry only the NIFTY candidates are caught, because the stocks are
# still pointing at a distant monthly. On the day before a MONTHLY expiry the
# weekly and the monthly fall on the same date and nothing has anywhere else
# to point.
#
# HOW OFTEN. Structurally about once a month - roughly 4-5% of sessions.
# Seen once in the instrumented record: 2026-09-28, when 1,177 of 1,177
# candidates were rejected `dte_below_min(1<2)` against expiry 2026-09-29,
# across all 20 underlyings. That one session is 98.3% of every DTE rejection
# ever recorded. Seen once more before the instrumentation existed, on
# 2026-08-24, known only from a written account.
#
# IT IS NOT A FAULT. All three rules behave exactly as written - the floor
# (stabilization.py, CHANGE 2), the 0DTE exclusion inside `nearest_expiry`,
# and the no-roll rule. The blackout is an interaction between them that none
# of them anticipated, not a defect in any of them. It clears by itself the
# next session: the expiring contracts become 0DTE, `nearest_expiry` skips
# them, and selection moves on to the following expiry.
#
# ITS COST IS UNKNOWN, WHICH IS NOT THE SAME AS ZERO. The blocked candidates
# never reached the contract lookup, the quote, the spread gate, the position
# cap or the selection stage - `quote_snapshot_id` and `spread_pct` are NULL
# on all 1,177 - so that number is NOT a count of trades that would have
# happened. For scale, on 2026-09-25 the same funnel took 523 candidates down
# to 8 entries. Whether blocking them cost money or saved money depends on
# the expectancy of the options book, which is not established.
#
# SOURCE. The rules arrived in 8428c38f (the floor and the no-roll rule,
# 2026-08-26) and 108a2938 (`nearest_expiry`, 2026-07-30). Read those two
# commit messages before changing anything here.
#
# ONE STALE CRITERION, FOR THE NEXT READER. The acceptance table in
# STABILIZATION-WED-2026-08-26.md predicts "DTE rejections: exactly 0" and
# calls a non-zero `rejected_dte` a DEFECT. That applied to ONE session,
# 2026-08-26, and is not a standing health criterion. Nothing executable
# asserts it. That document is a dated record of what was believed then and
# has deliberately been left as written.
# ---------------------------------------------------------------------------
#
# OPEN ITEM: `min_dte = 2` IS STILL LABELLED TEMPORARY
#
# Shipped 2026-08-26 in 8428c38f, explicitly as a temporary floor, on the
# rationale that it was "the least restrictive value that removes every
# observed DTE 0-1 trade" and that "DTE 2-3 has ZERO in-sample observations,
# so 2 and 4 are behaviourally identical on all historical data."
#
# It has not been revisited since. Recorded here with its ship date so that
# the word TEMPORARY does not become permanent by forgetting.
#
# This is a record, not a task, and it carries no due date. Revisiting the
# floor is not the next thing to do: the upstream question is whether the
# confluence signal clears its own 54.95% options round-trip breakeven, and
# at a measured 46-49% directional accuracy it does not.
# ---------------------------------------------------------------------------

on:
  # No internal `schedule:` trigger - GitHub's own cron scheduler is
  # documented "best effort" and was observed firing only ~1-2x/day instead
  # of the intended cadence. Triggered externally instead (cron-job.org ->
  # this workflow's workflow_dispatch, every 15 min during market hours).
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write         # needed to push the trading-state branch

concurrency:
  group: intraday-trader  # never run two passes at once (state would race)
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata     # make date.today()/now() IST, matching the strategy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      # The instrument master is ~35 MB and Angel One refreshes it daily.
      # angelone_client caches it on disk, but GitHub runners are
      # EPHEMERAL - that cache never survived a run, so every single cycle
      # re-downloaded 35 MB (~2.6 GB/day at 5-min polling, ~13 GB/day at
      # 1-min). Keyed by date so it still refreshes once every day.
      - name: Instrument master cache key (today's date, IST)
        id: imkey
        run: echo "day=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache instrument master
        uses: actions/cache@v4
        with:
          path: backtest-machine/scripmaster_cache.json
          key: scripmaster-${{ steps.imkey.outputs.day }}
          restore-keys: scripmaster-

      - name: Restore trading state
        env:
          STATE_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd backtest-machine
          python state_sync.py restore

      - name: Inject Telegram secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        if: env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          cd backtest-machine
          python3 << 'INJECT'
          import json, os
          cfg = json.load(open("intraday_config.json"))
          cfg["telegram"]["bot_token"] = os.environ["TG_BOT_TOKEN"]
          cfg["telegram"]["chat_id"] = os.environ["TG_CHAT_ID"]
          json.dump(cfg, open("intraday_config.json", "w"), indent=2)
          print("Telegram secrets injected.")
          INJECT

      - name: Run traders (simple stocks + options)
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          # pipefail is essential: `python x.py | tee` otherwise reports
          # tee's exit code, so a CRASHING trader still shows a green
          # step. That is exactly how a broken close_option() ran
          # undetected on 2026-08-04 and stranded positions overnight.
          set -o pipefail
          cd backtest-machine
          echo "=== SIMPLE STOCKS ===" | tee run_output.txt
          python simple_trader.py | tee -a run_output.txt
          echo "" | tee -a run_output.txt
          echo "=== OPTIONS ===" | tee -a run_output.txt
          python options_trader.py | tee -a run_output.txt

      - name: Save trading state
        if: always()
        env:
          STATE_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd backtest-machine
          # Owns the three trading books plus observability.db;
          # market_memory.db belongs to the pre-market workflow and is left
          # untouched, so the two cannot overwrite each other. state_sync
          # refuses to push a database with fewer closed trades than the
          # branch already holds.
          #
          # O-1: observability.db is saved HERE, in the existing per-cycle
          # commit, not in a separate end-of-session step. One commit, one
          # push, all four files - so this adds no Git traffic and replaces
          # the second post-close push the old EOD step performed. Deferring
          # it did not delay telemetry, it destroyed it: the runner is
          # ephemeral, so anything not pushed this cycle is gone.
          #
          # A rejected observability.db (corrupt, or fewer cycle rows than
          # the branch) is reported and skipped; the trading books in the
          # same call are still staged, committed and pushed.
          python state_sync.py save --own intraday_trades.db,simple_trades.db,options_trades.db,observability.db

      - name: Publish dashboard (GitHub Pages)
        if: always()
        run: |
          cd backtest-machine
          python generate_dashboard.py
          # S-30: idempotent publish - fast-forward, and skips the push
          # (and so the Pages build) when the dashboard is unchanged.
          bash publish_pages.sh "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
