name: Intraday Paper Trader

# Runs entirely on GitHub's servers, so it trades even when your PC is off.
# On the cadence configured in your external trigger (cron-job.org, every
# 15 min) during NSE market hours, on weekdays, it:
#   restore state -> fetch fresh price data -> signals -> paper orders -> save state
#
# The strategy squares off ALL positions at 15:15 IST, so nothing is ever held
# overnight; between-day state is just cash balance + trade history.

on:
  # No internal `schedule:` trigger - GitHub's own cron scheduler is
  # documented "best effort" and was observed firing only ~1-2x/day instead
  # of the intended cadence. Triggered externally instead (cron-job.org ->
  # this workflow's workflow_dispatch, every 15 min during market hours).
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write         # needed to push the trading-state branch

concurrency:
  group: intraday-trader  # never run two passes at once (state would race)
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata     # make date.today()/now() IST, matching the strategy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      # The instrument master is ~35 MB and Angel One refreshes it daily.
      # angelone_client caches it on disk, but GitHub runners are
      # EPHEMERAL - that cache never survived a run, so every single cycle
      # re-downloaded 35 MB (~2.6 GB/day at 5-min polling, ~13 GB/day at
      # 1-min). Keyed by date so it still refreshes once every day.
      - name: Instrument master cache key (today's date, IST)
        id: imkey
        run: echo "day=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache instrument master
        uses: actions/cache@v4
        with:
          path: backtest-machine/scripmaster_cache.json
          key: scripmaster-${{ steps.imkey.outputs.day }}
          restore-keys: scripmaster-

      - name: Restore trading state
        env:
          STATE_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd backtest-machine
          python state_sync.py restore

      - name: Inject Telegram secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        if: env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          cd backtest-machine
          python3 << 'INJECT'
          import json, os
          cfg = json.load(open("intraday_config.json"))
          cfg["telegram"]["bot_token"] = os.environ["TG_BOT_TOKEN"]
          cfg["telegram"]["chat_id"] = os.environ["TG_CHAT_ID"]
          json.dump(cfg, open("intraday_config.json", "w"), indent=2)
          print("Telegram secrets injected.")
          INJECT

      - name: Run traders (simple stocks + options)
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          # pipefail is essential: `python x.py | tee` otherwise reports
          # tee's exit code, so a CRASHING trader still shows a green
          # step. That is exactly how a broken close_option() ran
          # undetected on 2026-08-04 and stranded positions overnight.
          set -o pipefail
          cd backtest-machine
          echo "=== SIMPLE STOCKS ===" | tee run_output.txt
          python simple_trader.py | tee -a run_output.txt
          echo "" | tee -a run_output.txt
          echo "=== OPTIONS ===" | tee -a run_output.txt
          python options_trader.py | tee -a run_output.txt

      - name: Save trading state
        if: always()
        env:
          STATE_REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd backtest-machine
          # Owns the three trading books; market_memory.db belongs to the
          # pre-market workflow and is left untouched, so the two cannot
          # overwrite each other. state_sync refuses to push a database
          # with fewer closed trades than the branch already holds.
          python state_sync.py save --own intraday_trades.db,simple_trades.db,options_trades.db

      - name: Publish dashboard (GitHub Pages)
        if: always()
        run: |
          cd backtest-machine
          python generate_dashboard.py
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="intraday-ci" \
              -c user.email="ci@users.noreply.github.com" \
              commit -q -m "dashboard $(date -u +%FT%TZ)"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
