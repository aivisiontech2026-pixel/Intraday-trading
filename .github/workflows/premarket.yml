name: Pre-Market AI Analysis

# Two daily jobs on GitHub's servers (PC can be off):
#   08:15 IST — pre-market analysis: global markets, news sentiment,
#               technicals, historical similarity -> CALL/PUT/NO TRADE
#   16:15 IST — after-market learning: grade the morning call, update memory
#
# Optional secrets:
#   TG_BOT_TOKEN / TG_CHAT_ID  — Telegram reports
#   ANTHROPIC_API_KEY          — adds a Claude AI second opinion to the report

on:
  # No internal `schedule:` trigger - GitHub's own cron scheduler is
  # documented "best effort" and was observed firing hours late or getting
  # cancelled outright. Triggered externally instead (cron-job.org -> this
  # workflow's workflow_dispatch, at 08:15 and 16:15 IST).
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (premarket or eod)'
        type: choice
        options: [premarket, eod]
        default: premarket

permissions:
  contents: write

concurrency:
  group: premarket-analysis  # own lock - must NOT share the trader's, or these
  cancel-in-progress: false  # two daily crons queue behind the 5-min trading
                             # loop for hours and get delayed or cancelled

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      - name: Restore state
        run: |
          cd backtest-machine
          if git fetch origin trading-state --depth 1 2>/dev/null; then
            for f in intraday_trades.db simple_trades.db options_trades.db market_memory.db; do
              git show "FETCH_HEAD:$f" > "$f" 2>/dev/null && echo "restored $f" || true
            done
          else
            echo "No prior state."
          fi

      - name: Inject Telegram secrets
        run: |
          cd backtest-machine
          python3 - "$TG_BOT_TOKEN" "$TG_CHAT_ID" << 'INJECT'
          import json, sys
          cfg = json.load(open("intraday_config.json"))
          bot, chat = sys.argv[1], sys.argv[2]
          if bot and chat:
              cfg["telegram"] = {"bot_token": bot, "chat_id": chat}
              json.dump(cfg, open("intraday_config.json", "w"), indent=2)
              print("Telegram secrets injected.")
          else:
              print("Telegram secrets missing - reports go to log only.")
          INJECT
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      # scheduled: pick the job by which cron fired; manual: by the input
      - name: Run pre-market analysis
        if: inputs.job == 'premarket'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd backtest-machine
          python premarket_analyzer.py

      - name: Run after-market learning
        if: inputs.job == 'eod'
        run: |
          cd backtest-machine
          python eod_learner.py

      - name: Save state
        if: always()
        run: |
          cd backtest-machine
          tmp="$(mktemp -d)"
          # This job only owns market_memory.db. Re-fetch the trader's DBs
          # fresh right before pushing so a concurrent trading run (own
          # concurrency group now) never gets clobbered by this job's
          # possibly-stale restored snapshot of files it doesn't touch.
          if git fetch origin trading-state --depth 1 2>/dev/null; then
            for f in intraday_trades.db simple_trades.db options_trades.db; do
              git show "FETCH_HEAD:$f" > "$tmp/$f" 2>/dev/null || true
            done
          fi
          if [ -f market_memory.db ]; then
            cp market_memory.db "$tmp/"
          fi
          [ -n "$(ls -A "$tmp")" ] || { echo "Nothing to save."; exit 0; }
          cd "$tmp"
          git init -q
          git checkout -q -b trading-state
          git add -A
          git -c user.name="intraday-ci" \
              -c user.email="ci@users.noreply.github.com" \
              commit -q -m "state $(date -u +%FT%TZ)"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            trading-state

      - name: Publish dashboard (GitHub Pages)
        if: always()
        run: |
          cd backtest-machine
          python generate_dashboard.py
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="intraday-ci" \
              -c user.email="ci@users.noreply.github.com" \
              commit -q -m "dashboard $(date -u +%FT%TZ)"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
