name: Angel One Lookback Probe (read only)

# Answers ONE question: how far back does getCandleData serve 5-minute bars?
# That decides whether the signal-research corpus can be built at the
# production timeframe (5-minute) or must fall back to hourly.
#
# WHY THIS IS SAFE
#   * READ ONLY. It calls getCandleData and prints counts and timestamps.
#     No order, no trading call, no state write, no dashboard publish.
#   * `permissions: contents: read` - structurally unable to write to the
#     repository, so it cannot advance trading-state or gh-pages.
#   * There is NO `state_sync.py save` step and no publish step.
#   * workflow_dispatch ONLY. No `push:` trigger - a push trigger on the
#     stabilization branch previously cost a full diagnostic cycle, and this
#     workflow must never fire on its own.
#
# CREDENTIAL HYGIENE
#   Credentials reach the probe only as environment variables consumed by
#   angelone_client.login(). The probe never references them, and every
#   error path scrubs credential-shaped strings before printing.
#
# TIMING
#   Do NOT dispatch between 09:15 and 15:30 IST. It joins the trader's
#   concurrency group, so a run started during the session queues the live
#   trader behind it - the same hazard documented for the smoke test.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # SAME group as the trader: a probe must never overlap a live cycle.
  group: intraday-trader
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      - name: Probe Angel One historical lookback
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          set -o pipefail
          cd backtest-machine
          python angel_lookback_probe.py

      # Deliberately NO state restore, NO state save, NO dashboard publish.
      # The probe reads candles and prints; it leaves nothing behind.
