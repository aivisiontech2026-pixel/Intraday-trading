name: Angel Expired-Token Probe (read only)

# TASK B. The single question that decides whether a real OI backfill is ever
# possible: can an EXPIRED contract be addressed at all?
#
# Phase 3B-1 found 6,921 of 140,040 contracts addressable, entirely because
# expired tokens cannot be named. If any route resolves them, a 4.7-day fetch
# replaces a 1.9-year wait.
#
# THE DECISIVE TEST NEEDS NO SYMBOL LOOKUP. The production trade book holds 80
# tokens for contracts that have since expired, each with the dates it was
# entered and exited and the prices it filled at. The trade record proves the
# contract existed AND traded, so an empty response can only mean post-expiry
# unaddressability - not "not listed yet" and not "no open interest". Those
# two causes are excluded by evidence, not by argument.
#
# VERIFICATION RULE: a resolved token is not a solution until it returns data.
# Anything searchScrip hands back is immediately put to getOIData AND
# getCandleData on a date the contract demonstrably traded.
#
# WHY THIS IS SAFE
#   * READ ONLY. getOIData, getCandleData, searchScrip. Counts and statuses
#     are printed. No order, no trading call, no state write, no dashboard
#     publish, no production database, no artifact.
#   * `permissions: contents: read` - structurally unable to write here.
#   * workflow_dispatch ONLY. No push trigger, no schedule.
#
# CREDENTIAL HYGIENE. install_log_scrubber() is armed before login and
# re-armed after. searchScrip logs its results through the same logzero logger
# that prints request headers - X-PrivateKey on every AB1012, the Bearer JWT
# on network errors - and that logger writes straight to stderr through its
# own handler, so logging levels do not reach it. It is silenced by name AND
# both streams are wrapped.
#
# TIMING: the first step REFUSES to run between 09:15 and 15:30 IST in code,
# not by comment. This job joins the trader's concurrency group.

on:
  workflow_dispatch:
    inputs:
      allow_market_hours:
        description: 'Run even during 09:15-15:30 IST (queues the live trader behind this job)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: intraday-trader
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Refuse to run during market hours
        if: ${{ inputs.allow_market_hours != true }}
        run: |
          set -euo pipefail
          dow=$(date +%u); hm=$(date +%H%M)
          echo "IST now: $(date '+%Y-%m-%d %H:%M %A')"
          if [ "$dow" -le 5 ] && [ "$hm" -ge 0915 ] && [ "$hm" -le 1530 ]; then
            echo "::error::09:15-15:30 IST on a trading day. This job shares the"
            echo "::error::'intraday-trader' concurrency group, so running now would"
            echo "::error::queue the live trader behind it. Re-dispatch after 15:30."
            exit 1
          fi
          echo "Outside market hours - proceeding."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      - name: Probe expired-token addressability
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          set -o pipefail
          cd backtest-machine
          python angel_token_probe.py

      # Deliberately NO state restore, NO state save, NO publish, NO artifact -
      # the probe's entire output is the log.
