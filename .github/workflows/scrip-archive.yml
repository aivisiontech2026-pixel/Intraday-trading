name: Scrip Master Token Archive (no credentials)

# TASK A. Preserve scrip-master tokens BEFORE they expire.
#
# Phase 3B-1 established that Angel retains history for 365+ days, but
# retention only means the API will serve a contract you can NAME. The master
# is a live snapshot; once a contract expires its token is gone from every
# accessible source, and a token is an opaque exchange integer that cannot be
# derived from a symbol. 6,921 of 140,040 contracts are addressable today, and
# every day this does not run another few hundred become permanently
# unreachable. Verified locally: one simulated expiry day retired 246 NIFTY
# tokens at once.
#
# NO CREDENTIALS. The scrip master is a public unauthenticated endpoint. This
# workflow passes NO ANGEL_* secret and scrip_archive.py never reads one. That
# is what makes it safe for this job to hold a write token at all - it holds a
# write credential OR the Angel credentials, never both.
#
# PERMISSIONS ON THIS REPOSITORY: contents: read. It never writes here.
# `trading-state` and `gh-pages` are structurally out of reach.
#
# WHERE THE ARCHIVE GOES, and why not here.
#   An artifact expires, so an artifact is not an archive.
#   A research branch in THIS repository needs contents: write, which must not
#   exist in a workflow sitting beside the trader's state branches.
#   So the archive lives in a SEPARATE REPOSITORY, written with a fine-grained
#   PAT scoped to that one repository and nothing else. Blast radius is one
#   repo that holds only market metadata.
#
#   Configure two things, then this becomes durable:
#     secrets.ARCHIVE_REPO_TOKEN  fine-grained PAT, Contents: read+write,
#                                 scoped to the archive repository ONLY
#     vars.ARCHIVE_REPO           e.g. your-account/scrip-archive
#
#   Until they are set the job still runs, still reports, and uploads the
#   registry as a 90-day artifact - but it CANNOT compute day-over-day deltas,
#   because it has no yesterday to compare against. The fallback exists to
#   prove the workflow works, not to preserve anything.
#
# VERIFICATION CONTRACT (added after two diagnostic cycles)
#   A green run is NOT a pass. The push step prints the local commit SHA, the
#   push output, and an independent `git ls-remote` of the target branch. An
#   auth failure can no longer masquerade as an empty first-run repository,
#   and the target branch is resolved from the remote rather than hardcoded.
#
# FAIL LAST, NOT FIRST
#   Loudness must never cost data. The day's snapshot is the one thing that
#   cannot be recovered afterwards, so the order is: fetch (never aborts) ->
#   BUILD the snapshot -> UPLOAD the artifact -> attempt the push -> and only
#   then a final gate that turns the run RED. An unreachable archive
#   repository therefore costs one day-over-day comparison, not the snapshot.
#   The first version of this fix had it backwards: `exit 1` in the fetch step
#   skipped the build (GitHub's default step condition is success()), leaving
#   nothing on disk for `if: always()` to upload.
#
# SCHEDULE: 11:37 UTC = 17:07 IST, daily. After the 15:30 close and the
# closing auction, so the master is final for the day, and far outside
# 09:15-15:30. Daily rather than weekday-only so a Monday expiry is never
# missed because Friday's run failed.
#
#   WHY 11:37 AND NOT 11:00. Measured firing times for runs #12-#17 were
#   3.0-4.4 hours LATE against the 11:00 UTC cron. GitHub queues scheduled
#   workflows and documents that the top of the hour is the most contended
#   minute, recommending a different one. A workflow delayed far enough can
#   be DROPPED for that interval rather than merely deferred, so this drift
#   is not cosmetic - it is the symptom that precedes a missed run.
#   HONEST CAVEAT: moving off :00 addresses the documented cause but its
#   effect here is UNMEASURED. Treat it as a cheap, reasonable measure, not
#   as a fix. The drift must be re-measured over the next several runs, and
#   if it persists the schedule cannot be trusted for an expiry day at all.
#   Even at the worst observed drift (+4.4 h) this lands 21:30 IST, still
#   far outside 09:15-15:30 IST and still the same calendar day.
#
# EXPIRY-DAY CHECKLIST - 2026-09-29 AND 2026-09-30
#   The September monthly expiry is Tuesday 2026-09-29 (~13,136 contracts).
#   Follow this as written; it needs no other document.
#
#   1. WHEN. Dispatch by hand on Tue 2026-09-29 and again on Wed 2026-09-30,
#      any time after 15:30 IST, from Actions -> this workflow -> Run
#      workflow. Do this REGARDLESS of whether the scheduled run appears to
#      have fired. The schedule fires 3.0-4.4 hours late and is the one
#      component here with a measured failure mode.
#
#   2. AVOID THE OVERLAP. The 17:07 IST cron is still armed. This workflow
#      has `concurrency: group: scrip-archive, cancel-in-progress: false`, so
#      an overlapping run QUEUES rather than races - two runs can never push
#      at once. But a queued run is still a run, and a same-day second run is
#      a no-op that reports `pushed=unchanged`. Simplest: WAIT for the
#      scheduled run to finish (it lands 20:00-22:15 IST), read its result,
#      and only dispatch if it is red or absent. If you would rather not
#      wait, dispatch after 15:30 IST and let the scheduled run queue behind
#      it - that is safe, just noisier. Do NOT disable the schedule: a
#      disabled schedule that nobody re-enables is a worse failure than a
#      duplicate run.
#
#   3. WHAT SUCCESS LOOKS LIKE. One line, and only this line, means the
#      archive provably carries the day:
#          VERIFIED: main on the archive repository is now <sha>
#      followed by `ARCHIVE OK - push verified`. On a same-day second run,
#      `registry unchanged - nothing to commit` and `ARCHIVE OK - push
#      unchanged` are also a pass - the first run already did the work.
#      A green run WITHOUT one of those lines is not a pass.
#
#   4. ON RED. Re-dispatch, and keep re-dispatching until a VERIFIED: line
#      appears. The push now retries 3 times internally with a 5s/15s
#      backoff, so a red push means the failure outlasted ~20 seconds.
#      Wait a few minutes between manual retries and check
#      githubstatus.com for a Git Operations incident.
#
#   5. THE ARTIFACT IS A FALLBACK, NOT THE ARCHIVE. Every run uploads
#      `scrip-token-registry` whether or not the push succeeds, and it is
#      retained 90 days. If 09-29 ends red and cannot be made green, DOWNLOAD
#      THAT ARTIFACT THE SAME WEEK. It expires; the archive branch does not.
#
#   WHY BOTH DAYS, and the asymmetry between them:
#     2026-09-29  captures the expiring contracts while they are STILL
#                 LISTED. Contracts remain in the master on their expiry
#                 date; this is the last snapshot in which their tokens are
#                 addressable at all. MISSING IT LOSES ~13,136 TOKENS
#                 PERMANENTLY.
#     2026-09-30  is the snapshot whose day-over-day comparison RECORDS the
#                 retirement - `disappeared` is computed against the prior
#                 run. Missing it loses only the retirement DATE, which is
#                 recoverable from any later run's first_seen/last_seen.
#
#   A RED RUN ON 09-29 IS NOT SURVIVABLE BY ITSELF. Run #21 (2026-09-24)
#   fetched and built cleanly, then failed at the push on a GitHub-side HTTP
#   500. That is nearly free on an ordinary day - the next run re-fetches the
#   last pushed state and the only tokens lost are ones that vanished from
#   the master in between. On an EXPIRY day, "vanished in between" is exactly
#   what the run exists to preserve.
#
# TODO 2026-10-01: remove the `archive target: ${ARCHIVE_REPO}` echo in the
#   fetch step. It is a deliberate, time-boxed disclosure - this repository is
#   public, so that line publishes a private repository's name. It stays
#   through the 09-29/09-30 expiry because a wrong-repo failure passes every
#   other check silently, and the name is the only thing that catches it.
#   After 2026-10-01 it has served its purpose and must come out. A
#   fingerprint variant (sha256 prefix of the name) was proposed as a
#   permanent replacement and DEFERRED; note that it is a tamper indicator,
#   not a confidentiality measure - `owner/name` is low-entropy and a hash
#   prefix of it is brute-forceable.
#
# CONCURRENCY: its own group. It shares no resource with the trader - no Angel
# session, no rate limit, no state - so putting it in `intraday-trader` would
# only risk queueing the trader behind it for no benefit.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '37 11 * * *'        # 11:37 UTC = 17:07 IST - off the contended :00

permissions:
  contents: read

concurrency:
  group: scrip-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
      ARCHIVE_REPO: ${{ vars.ARCHIVE_REPO }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # (a) An auth failure must never again look like a first run.
      #     Previously this ran under `set -uo pipefail` with NO `-e`, and the
      #     clone sat inside an `if`, so nothing in it could fail the step. A
      #     bad token printed "no existing archive - initialising" exactly like
      #     an empty repo does, and every downstream step then built on an
      #     empty history while the run stayed green.
      #
      #     `durable` also used to be set on BOTH branches, so it proved the
      #     config existed and nothing about the clone. It is replaced by two
      #     honest outputs: `configured` (the settings are present) and
      #     `have_archive` (an existing registry was actually retrieved).
      - name: Fetch the existing registry from the archive repository
        id: pull
        run: |
          set -euo pipefail
          if [ -z "${ARCHIVE_REPO:-}" ] || [ -z "${ARCHIVE_TOKEN:-}" ]; then
            echo "::warning::ARCHIVE_REPO / ARCHIVE_REPO_TOKEN not configured."
            echo "::warning::Running in REPORT-ONLY mode - nothing is preserved,"
            echo "::warning::and deltas cannot be computed without a prior registry."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "have_archive=false" >> "$GITHUB_OUTPUT"
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          # A repository NAME is not a credential. GitHub masks secrets in logs
          # and does not mask variables, precisely because variables are not
          # secret. Printing it lets the run answer the wrong-repo question in
          # its own log instead of by eye. The TOKEN is never printed.
          echo "archive target: ${ARCHIVE_REPO}"
          URL="https://x-access-token:${ARCHIVE_TOKEN}@github.com/${ARCHIVE_REPO}.git"

          # Capture stderr rather than discarding it. It is NEVER printed raw:
          # git echoes the remote URL in its errors and that URL embeds the
          # token. Everything printed below passes through the scrubber first.
          set +e
          OUT=$(git clone --depth 1 "$URL" archive 2>&1)
          RC=$?
          set -e
          SAFE=$(printf '%s' "$OUT" | sed -e "s|${ARCHIVE_TOKEN}|<redacted>|g" \
                                          -e 's|x-access-token:[^@]*@|<redacted>@|g')

          if [ "$RC" -eq 0 ]; then
            # git returns 0 for an EMPTY repository too (with a warning), so
            # "clone succeeded" does not mean "an archive was retrieved".
            # have_archive must state the second thing, or it repeats exactly
            # the false implication `durable` used to carry.
            if [ -s archive/scrip_token_registry.db ]; then
              echo "cloned existing archive, registry present"
              echo "have_archive=true" >> "$GITHUB_OUTPUT"
            else
              echo "cloned, but the repository holds no registry yet (first run)"
              echo "have_archive=false" >> "$GITHUB_OUTPUT"
            fi
          elif printf '%s' "$SAFE" | grep -qiE \
               'empty repository|could not find remote branch|remote branch .* not found'; then
            # Legitimate first-run states, and the ONLY ones that may initialise.
            echo "archive repository is empty - initialising (first run)"
            echo "clone said: $SAFE"
            mkdir -p archive
            git -C archive init -q
            git -C archive remote add origin "$URL"
            echo "have_archive=false" >> "$GITHUB_OUTPUT"
          else
            # FAIL LAST, NOT FIRST. Aborting here would skip the registry
            # build (GitHub's default step condition is success()), leaving
            # nothing on disk for the artifact upload to preserve - so a wrong
            # ARCHIVE_REPO would cost the DAY'S SNAPSHOT, not just the push.
            # Record the failure, carry on, and let the final step go red.
            echo "::warning::git clone FAILED for a reason other than an empty"
            echo "::warning::repository. This is NOT a first run, and initialising"
            echo "::warning::here would push an unrelated history over the archive."
            echo "::warning::clone said: $SAFE"
            echo "::warning::Most likely: the PAT is wrong, expired, lacks"
            echo "::warning::Contents read+write, or does not have the archive repo"
            echo "::warning::selected under 'Only select repositories'."
            echo "::warning::CONTINUING so the day's snapshot is still built and"
            echo "::warning::uploaded. The job will be failed at the end."
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            echo "have_archive=false" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            mkdir -p archive
            exit 0
          fi
          echo "fetch_ok=true" >> "$GITHUB_OUTPUT"

          # (b) Resolve the archive repo's ACTUAL default branch. The old code
          #     hardcoded `main`; if the archive defaults to `master` that
          #     silently creates a divergent branch, the registry never
          #     accumulates, and every run still reports success. `master` is
          #     live in this account already (semantic-glue).
          DEF=$(git -C archive ls-remote --symref origin HEAD 2>/dev/null \
                | sed -n 's|^ref: refs/heads/\([^[:space:]]*\).*|\1|p' | head -1 || true)
          if [ -z "$DEF" ]; then
            DEF=$(git -C archive symbolic-ref --short HEAD 2>/dev/null || true)
          fi
          if [ -z "$DEF" ]; then
            DEF=main
            echo "remote has no default branch yet (empty repo); will create '$DEF'"
          else
            echo "archive default branch resolved to '$DEF'"
          fi
          echo "branch=$DEF" >> "$GITHUB_OUTPUT"
          ls -la archive || true
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_REPO_TOKEN }}

      # `always()` on purpose: the day's snapshot is the thing that cannot be
      # recovered later, so it is built before anything else is allowed to fail.
      - name: Update the token registry
        if: always()
        run: |
          set -o pipefail
          if [ "${{ steps.pull.outputs.have_archive }}" != "true" ]; then
            echo "NOTE: no prior archive was retrieved, so this run builds a"
            echo "STANDALONE snapshot for today. The day-over-day 'disappeared'"
            echo "comparison is not possible for this run - that is a loss of one"
            echo "comparison, not a loss of the snapshot."
          fi
          mkdir -p archive
          python backtest-machine/scrip_archive.py \
            --db archive/scrip_token_registry.db

      # KEPT deliberately. It is the only durable copy that currently exists,
      # and the per-run artifact SIZE SERIES was the single most informative
      # piece of evidence in the push diagnosis. The confusion it caused came
      # from the step name, not the upload - so the name is now unambiguous.
      - name: Upload registry (belt-and-braces copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrip-token-registry
          path: archive/scrip_token_registry.db
          retention-days: 90
          if-no-files-found: warn

      # (c) The log must carry PROOF of the commit, not an exit code. A green
      #     run without a confirmed SHA is not a pass, and the absence of this
      #     is what cost two diagnostic cycles.
      - name: Commit and push the archive
        # success() must be stated explicitly: supplying any `if:` REPLACES
        # GitHub's default success() condition, so without it this step would
        # run even after an earlier step had failed.
        if: >-
          success()
          && steps.pull.outputs.configured == 'true'
          && steps.pull.outputs.fetch_ok == 'true'
        id: push
        run: |
          set -euo pipefail
          BRANCH="${{ steps.pull.outputs.branch }}"
          cd archive
          git config user.name  "scrip-archive-bot"
          git config user.email "noreply@github.com"
          git add -A scrip_token_registry.db
          if git diff --cached --quiet; then
            echo "registry unchanged - nothing to commit (a same-day re-run)"
            BEFORE=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "HEAD remains $BEFORE"
            echo "pushed=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "scrip registry $(date +%F)"
          SHA=$(git rev-parse HEAD)
          echo "local commit: $SHA  -> pushing to '$BRANCH'"

          # (d) BOUNDED RETRY. Run #21 (2026-09-24) failed on a GitHub-side
          #     HTTP 500 from the receive side - not auth, not a
          #     non-fast-forward, not a race. No declared GitHub incident
          #     covered 15:35:36Z, so it was a brief unannounced blip rather
          #     than an outage, which is exactly what a retry is for.
          #
          #     3 attempts, backoff 5s then 15s: ~20s of added latency in the
          #     worst case, trivial against a 20-minute job timeout, and wide
          #     enough to straddle a blip without pretending to ride out an
          #     outage. NEVER --force, on any attempt: every try is the same
          #     plain push, so a retry can only fast-forward, never overwrite.
          #     Retries fire ONLY on a non-zero push exit. A verification
          #     mismatch is a different condition and stays fatal, unretried.
          ATTEMPTS=3
          PRC=1
          n=0
          for WAIT in 5 15 ""; do
            n=$((n+1))
            set +e
            POUT=$(git push origin "HEAD:$BRANCH" 2>&1); PRC=$?
            set -e
            PSAFE=$(printf '%s' "$POUT" | sed -e "s|${ARCHIVE_TOKEN}|<redacted>|g" -e 's|x-access-token:[^@]*@|<redacted>@|g')
            echo "push attempt $n/$ATTEMPTS -> exit $PRC"
            echo "push said: $PSAFE"
            if [ "$PRC" -eq 0 ]; then
              break
            fi
            if [ -n "$WAIT" ]; then
              echo "::warning::push attempt $n failed (exit $PRC); retrying in ${WAIT}s."
              echo "::warning::Same plain push, no force variant."
              sleep "$WAIT"
            fi
          done
          if [ "$PRC" -ne 0 ]; then
            echo "::warning::all $ATTEMPTS push attempts returned non-zero. Asking the"
            echo "::warning::remote anyway - a push can land and still report an error,"
            echo "::warning::and a VERIFIED SHA is the only definition of a pass."
          fi

          # Independent confirmation: ask the REMOTE what it now holds.
          set +e
          LOUT=$(git ls-remote origin "refs/heads/$BRANCH" 2>&1); LRC=$?
          set -e
          LSAFE=$(printf '%s' "$LOUT" | sed -e "s|${ARCHIVE_TOKEN}|<redacted>|g" \
                                            -e 's|x-access-token:[^@]*@|<redacted>@|g')
          REMOTE_SHA=$(printf '%s' "$LSAFE" | awk 'NR==1{print $1}')
          echo "ls-remote refs/heads/$BRANCH -> $LSAFE"
          if [ "$LRC" -ne 0 ] || [ "$SHA" != "$REMOTE_SHA" ]; then
            if [ "$PRC" -ne 0 ]; then
              echo "::error::PUSH FAILED after $ATTEMPTS attempts (last exit $PRC)"
              echo "::error::and the remote does not carry $SHA. Not force-pushing."
            else
              echo "::error::VERIFICATION FAILED. local $SHA != remote '$REMOTE_SHA'."
              echo "::error::The push reported success but the branch does not carry it."
            fi
            exit 1
          fi
          if [ "$PRC" -ne 0 ]; then
            echo "NOTE: the push reported exit $PRC, but the remote provably carries"
            echo "      $SHA. That is a PASS - a push can land and still report an"
            echo "      error, and ls-remote is what decides."
          fi
          echo "VERIFIED: $BRANCH on the archive repository is now $SHA"
          echo "pushed=verified" >> "$GITHUB_OUTPUT"
        env:
          ARCHIVE_TOKEN: ${{ secrets.ARCHIVE_REPO_TOKEN }}

      # FAIL LAST. Everything irreplaceable - the day's snapshot and its
      # artifact - is already done by the time this runs. This step exists
      # only to make the run RED so the operator is alerted, never to prevent
      # the preservation that precedes it.
      - name: Final status gate
        if: always()
        run: |
          set -uo pipefail
          CONFIGURED="${{ steps.pull.outputs.configured }}"
          FETCH_OK="${{ steps.pull.outputs.fetch_ok }}"
          PUSHED="${{ steps.push.outputs.pushed }}"
          echo "configured=$CONFIGURED  fetch_ok=$FETCH_OK  pushed=$PUSHED"
          if [ "$CONFIGURED" != "true" ]; then
            echo "::warning::REPORT-ONLY: ARCHIVE_REPO / ARCHIVE_REPO_TOKEN are"
            echo "::warning::not configured. The snapshot was built and uploaded"
            echo "::warning::as an artifact, but nothing is durably preserved."
            exit 0
          fi
          if [ "$FETCH_OK" != "true" ]; then
            echo "::error::ARCHIVE FETCH FAILED. The day's snapshot WAS built and"
            echo "::error::uploaded as an artifact, so nothing is lost today - but"
            echo "::error::the archive repository was not reachable and the"
            echo "::error::disappeared-token comparison could not be made."
            echo "::error::Check the 'archive target:' line above against the"
            echo "::error::repository you expect, and check the PAT's scope."
            exit 1
          fi
          if [ "$PUSHED" != "verified" ] && [ "$PUSHED" != "unchanged" ]; then
            echo "::error::PUSH NOT VERIFIED (pushed='$PUSHED'). The snapshot is"
            echo "::error::safe in the artifact, but the archive repository does"
            echo "::error::not provably carry it. A green run is not a pass."
            exit 1
          fi
          echo "ARCHIVE OK - push $PUSHED"
