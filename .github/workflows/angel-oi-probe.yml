name: Angel OI Probe (read only)

# Answers ONE question, the one Phase 3A left open: does getOIData serve
# HISTORICAL open interest, how deep, at what interval, and per contract or
# per underlying? Open interest is the only Phase 3A candidate that could be
# non-price AND per-symbol AND intraday - the only combination that reaches
# the certification bar in ~2 years instead of ~35.
#
# INVENTORY ONLY. It establishes what the endpoint serves. It tests no
# signal, stores no data, and concludes nothing about tradeability.
#
# WHY THIS IS SAFE
#   * READ ONLY. It calls getOIData and getCandleData and prints counts,
#     shapes and timestamps. No order, no trading call, no state write, no
#     dashboard publish, no production database is opened.
#   * `permissions: contents: read` - structurally unable to write to the
#     repository, so it cannot touch trading-state or gh-pages.
#   * There is NO `state_sync.py save` step and no publish step.
#   * workflow_dispatch ONLY. No `push:` trigger - a push trigger on the
#     stabilization branch previously cost a full diagnostic cycle.
#
# CREDENTIAL HYGIENE
#   Credentials reach the probe only as environment variables consumed by
#   angelone_client.login(). The probe never references them, and every
#   printed string - including API responses and error paths - passes
#   through a scrubber that removes credential-shaped runs.
#
# TIMING
#   The step below REFUSES to run between 09:15 and 15:30 IST rather than
#   relying on a comment. This job joins the trader's concurrency group, so
#   a run started during the session would queue the live trader behind it.

on:
  workflow_dispatch:
    inputs:
      allow_market_hours:
        description: 'Run even during 09:15-15:30 IST (queues the live trader behind this job)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # SAME group as the trader: a probe must never overlap a live cycle.
  group: intraday-trader
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Refuse to run during market hours
        if: ${{ inputs.allow_market_hours != true }}
        run: |
          set -euo pipefail
          dow=$(date +%u); hm=$(date +%H%M)
          echo "IST now: $(date '+%Y-%m-%d %H:%M %A')"
          if [ "$dow" -le 5 ] && [ "$hm" -ge 0915 ] && [ "$hm" -le 1530 ]; then
            echo "::error::09:15-15:30 IST on a trading day. This job shares the"
            echo "::error::'intraday-trader' concurrency group, so running now would"
            echo "::error::queue the live trader behind it. Re-dispatch after 15:30,"
            echo "::error::or set allow_market_hours if that is genuinely intended."
            exit 1
          fi
          echo "Outside market hours - proceeding."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      - name: Probe getOIData
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          set -o pipefail
          cd backtest-machine
          python angel_oi_probe.py

      # Deliberately NO state restore, NO state save, NO dashboard publish,
      # and no artifact - the probe's entire output is the log.
